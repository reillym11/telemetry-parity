# Manual parity of every job's sample fixture against a given Rust image.
name: parity

on:
  workflow_dispatch:
    inputs:
      rust_image:
        description: Rust image to compare against the legacy jobs
        required: true

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: scripts/fetch-deps.sh
      - env:
          RUST_IMAGE: ${{ inputs.rust_image }}
        run: |
          source deps.lock
          img="ghcr.io/${{ github.repository }}/spark-runner:${TELEMETRY_SPARK_JOBS_SHA:0:12}"
          if docker pull -q "$img"; then export SPARK_RUNNER_IMAGE="$img"; fi
          for j in ota-status-tracker charging-session-builder battery-health-aggregator diagnostics-dtc-router; do
            ./run.sh --job $j --fixture sample --chaos || status=1
          done
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: runs/
          retention-days: 30
